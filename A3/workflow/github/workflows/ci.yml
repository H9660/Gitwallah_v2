name: CI

# Runs for humans (push / PR) and is also called by autose.yml, because a PR
# opened with GITHUB_TOKEN does not trigger other workflows on its own.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        type: string
        required: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # --ignore-scripts: node-pty is native and is mocked in tests.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r .autose/requirements.txt pytest
      - run: python -m pytest -q .autose/tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
